name: hizhina

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-directus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    # Только data: до базы дотягивается один Directus. Раньше db стояла
    # в общей сети, то есть Postgres был виден и с web, и с nginx — притом
    # что обращается к нему ровно один сервис.
    networks:
      - data

  directus:
    image: directus/directus:11.5.1
    restart: unless-stopped
    ports:
      - "${DIRECTUS_PUBLISH:-8055}:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET:-replace-with-long-random-string}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-directus}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus-change-me}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me-admin-password}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      WEBSOCKETS_ENABLED: "true"
      # Браузер никогда не обращается к Directus напрямую: сайт фетчит
      # контент на сервере, а фото у гостей грузятся как обычные <img>,
      # не через fetch/XHR — CORS с любого origin тут не нужен вообще.
      CORS_ENABLED: "false"
      # Общий rate-limiter на API (в т.ч. /auth/login). Пороги нарочно
      # нежёсткие: билд/ревалидация делают по 5 параллельных запросов
      # к Directus на каждую локаль, слишком тугой лимит валил бы их 429.
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: "100"
      RATE_LIMITER_DURATION: "1"
      # Cookie только по HTTPS — сайт и CMS предполагаются доступными
      # только по TLS (см. HSTS в next.config.ts).
      SESSION_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SECURE: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # data — чтобы ходить в Postgres, edge — чтобы его видели nginx и web.
    networks:
      - data
      - edge

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-localhost:8055}
        NEXT_PUBLIC_IMAGE_PROTOCOL: ${NEXT_PUBLIC_IMAGE_PROTOCOL:-}
        NEXT_PUBLIC_YANDEX_METRICA_ID: ${NEXT_PUBLIC_YANDEX_METRICA_ID:-}
        # Билд идёт в изолированной от compose-сети среде buildx — внутренний
        # http://directus:8055 там не резолвится в принципе. А вот публичный
        # адрес CMS доступен по обычному интернету (как и npm-регистр для
        # pnpm install), поэтому здесь — тот же DIRECTUS_URL, что в .env для
        # bootstrap/seed (см. .env.example), а не внутренний хост.
        DIRECTUS_URL: ${DIRECTUS_URL:-http://directus:8055}
        # Подстраховка на случай, если DIRECTUS_URL/TOKEN не заданы (самый
        # первый bootstrap) или CMS всё же недоступна на этапе билда —
        # тогда просто соберётся TS-фолбэк, как раньше, без падения сборки.
        CONTENT_FALLBACK: static
        APP_ENV: ${APP_ENV:-production}
      # Токен уходит в сборку секретом, а не build-arg: ARG со значением
      # остаётся в `docker history` промежуточного образа. См. Dockerfile.
      secrets:
        - directus_token
    restart: unless-stopped
    ports:
      - "${WEB_PUBLISH:-3000}:3000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DIRECTUS_URL: http://directus:8055
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me-revalidate-secret}
      CONTENT_FALLBACK: ${CONTENT_FALLBACK:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-localhost:8055}
      NEXT_PUBLIC_IMAGE_PROTOCOL: ${NEXT_PUBLIC_IMAGE_PROTOCOL:-}
    depends_on:
      - directus
    security_opt:
      - no-new-privileges:true
    # Единственный сервис, которому можно снять все capabilities без оговорок:
    # это `node server.js` от непривилегированного uid 1001 на порту 3000 —
    # ни привязки к привилегированному порту, ни смены пользователя на старте.
    cap_drop:
      - ALL
    # Проверка живости для `docker compose ps`: сам Next не логирует готовность
    # так, чтобы это было видно снаружи. depends_on у nginx намеренно оставлен
    # мягким (service_started): если web не поднимется, шлюз всё равно должен
    # стартовать и отдавать CMS, через которую правят контент.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ru').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - edge

  # Gateway runs with Nginx UI; proxy sites are seeded by nginx-ui.Dockerfile.
  nginx:
    build:
      context: .
      dockerfile: nginx-ui.Dockerfile
    image: hizhina-nginx-ui:local
    restart: unless-stopped
    environment:
      NGINX_UI_IGNORE_DOCKER_SOCKET: "true"
    ports:
      - "80:80"
      - "443:443"
      # Панель Nginx UI доступна снаружи — так решено сознательно, чтобы
      # заходить в неё без SSH-туннеля.
      #
      # Учтите при настройке файрвола: Docker публикует порты собственными
      # правилами DNAT в iptables, которые UFW не перехватывает. Правило
      # `ufw deny 9000` этот порт НЕ закроет. Ограничивать доступ нужно
      # либо через DOCKER-USER chain, либо на уровне облачного файрвола
      # провайдера.
      - "9000:9000"
    volumes:
      - nginx_config:/etc/nginx
      - nginx_ui_data:/etc/nginx-ui
    depends_on:
      - web
      - directus
    security_opt:
      - no-new-privileges:true
    # cap_drop здесь сознательно нет: nginx привязывается к 80/443 и роняет
    # привилегии воркеров сам, поэтому ему нужны NET_BIND_SERVICE, SETUID,
    # SETGID и CHOWN. Отнимать всё и возвращать их списком — тот же набор,
    # только с риском промахнуться. То же соображение для db и directus.
    networks:
      - edge

# Значение берётся из переменной окружения DIRECTUS_TOKEN — той же, что уже
# лежит в .env. Требует Docker Compose v2.20+ (источник `environment` у секретов).
# Если переменная пуста, секрет приходит пустым и сборка уходит на
# CONTENT_FALLBACK=static — то же поведение, что и раньше при недоступной CMS.
secrets:
  directus_token:
    environment: DIRECTUS_TOKEN

volumes:
  pgdata:
  directus_uploads:
  directus_extensions:
  nginx_config:
  nginx_ui_data:

networks:
  # Периметр: nginx ↔ web ↔ directus.
  edge:
    driver: bridge
  # Только Postgres и Directus. Сюда не входят ни web, ни шлюз.
  data:
    driver: bridge
